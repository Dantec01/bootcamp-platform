    async function renderMain() {
      const target = document.getElementById('main');
      const { mod, lesson } = findLesson();

      if (!lesson) {
        target.innerHTML = `<div class="empty-state">
        <h3>Selecciona una lección</h3>
        <p>Elige una lección del panel izquierdo para ver sus materiales.${isAdmin ? ' O crea un módulo y una lección para empezar.' : ''}</p>
      </div>`;
        return;
      }

      // Todo se construye aquí, fuera de la vista, y recién al final se intercambia con el
      // contenido real en un solo paso — así nada desaparece mientras se resuelven las partes
      // asíncronas en el camino (evita el parpadeo al abrir/cerrar el formulario).
      const main = document.createElement('div');

      const header = document.createElement('div');
      header.className = 'lesson-header';
      const mi = state.modules.findIndex(m => m.id === mod.id);
      const li = mod.lessons.findIndex(l => l.id === lesson.id);
      header.innerHTML = `<div class="lesson-eyebrow">${escapeHtml(mod.title)} · Lección ${mi + 1}.${li + 1}</div>
      <h1 class="lesson-title" id="lessonTitleEl">${escapeHtml(lesson.title)}</h1>`;
      main.appendChild(header);

      const titleEl = header.querySelector('#lessonTitleEl');
      titleEl.contentEditable = isAdmin ? 'true' : 'false';
      titleEl.onblur = async () => {
        const v = titleEl.textContent.trim();
        if (v && v !== lesson.title) {
          await optimisticUpdate(() => { lesson.title = v; });
        }
      };

      const showingNewGhost = pendingUpload && pendingUpload.isNew && pendingUpload.lessonId === lesson.id;

      if (lesson.materials.length === 0 && !showingNewGhost) {
        const empty = document.createElement('div');
        empty.className = 'empty-state';
        empty.style.padding = '40px 20px';
        empty.innerHTML = isAdmin
          ? `<h3>Sin materiales todavía</h3><p>Agrega el primero con el botón de abajo.</p>`
          : `<h3>Sin materiales todavía</h3><p>El instructor aún no agregó contenido a esta lección.</p>`;
        main.appendChild(empty);
      }

      for (const mat of lesson.materials) {
        if (pendingUpload && !pendingUpload.isNew && pendingUpload.matId === mat.id && pendingUpload.lessonId === lesson.id) {
          main.appendChild(buildUploadingGhostCard());
          continue;
        }
        const card = document.createElement('div');
        card.className = 'material';
        const head = document.createElement('div');
        head.className = 'material-head';
        const sourceBadge = '';
        head.innerHTML = `<span class="type-chip type-${mat.type}">${TYPE_LABEL[mat.type]}</span><span class="material-title">${escapeHtml(mat.title)}</span>${sourceBadge}`;
        if (isAdmin) {
          const actions = document.createElement('div');
          actions.className = 'material-actions';
          const editBtn = document.createElement('button');
          editBtn.className = 'btn-ghost small';
          editBtn.id = 'editMaterialBtn-' + mat.id;
          editBtn.textContent = formTarget === mat.id ? 'Cerrar edición' : 'Editar';
          editBtn.onclick = () => {
            const existingPanel = document.getElementById('editPanel-' + mat.id);
            if (existingPanel) {
              existingPanel.remove();
              formTarget = null;
              editBtn.textContent = 'Editar';
              return;
            }
            // solo un panel de edición/creación abierto a la vez, igual que antes
            document.querySelectorAll('[id^="editPanel-"], #newMaterialPanel').forEach(p => p.remove());
            formTarget = mat.id;
            editBtn.textContent = 'Cerrar edición';
            const panel = buildMaterialPanel(lesson, mat);
            panel.id = 'editPanel-' + mat.id;
            card.insertAdjacentElement('afterend', panel);
            // Igual que al añadir: lleva la vista hasta el formulario de edición recién abierto.
            panel.scrollIntoView({ behavior: 'smooth', block: 'center' });
          };
          const delBtn = document.createElement('button');
          delBtn.className = 'btn-ghost small danger';
          delBtn.textContent = 'Eliminar';
          delBtn.onclick = async () => {
            const ok = await confirmModal(`Se eliminará "${mat.title}". Esta acción no se puede deshacer.`, { title: 'Eliminar material' });
            if (!ok) return;
            await optimisticUpdate(() => {
              lesson.materials = lesson.materials.filter(m => m.id !== mat.id);
              if (formTarget === mat.id) formTarget = null;
            });
          };
          actions.appendChild(editBtn);
          actions.appendChild(delBtn);
          head.appendChild(actions);
        }
        card.appendChild(head);
        const bodyWrap = document.createElement('div');
        bodyWrap.innerHTML = await renderMaterialBody(mat);
        bodyWrap.querySelectorAll('audio').forEach(applyAudioPrefs);
        // Las imágenes de materiales abren el visor a pantalla completa con zoom/pan.
        bodyWrap.querySelectorAll('.material-body img').forEach(img => {
          img.addEventListener('click', () => openImageViewer(img));
        });
        card.appendChild(bodyWrap);
        main.appendChild(card);

        if (isAdmin && formTarget === mat.id) {
          const panel = buildMaterialPanel(lesson, mat);
          panel.id = 'editPanel-' + mat.id;
          main.appendChild(panel);
        }
      }

      if (showingNewGhost) {
        main.appendChild(buildUploadingGhostCard());
      }

      if (isAdmin) {
        const row = document.createElement('div');
        row.className = 'lesson-actions-row';

        const delLessonBtn = document.createElement('button');
        delLessonBtn.className = 'btn-ghost danger';
        delLessonBtn.textContent = 'Eliminar esta lección';
        delLessonBtn.onclick = async () => {
          const ok = await confirmModal(`Se eliminará la lección "${lesson.title}" y todos sus materiales. Esta acción no se puede deshacer.`, { title: 'Eliminar lección' });
          if (!ok) return;
          await optimisticUpdate(() => {
            mod.lessons = mod.lessons.filter(l => l.id !== lesson.id);
            selected = { moduleId: null, lessonId: null };
            saveSelection();
          });
        };

        const addBtn = document.createElement('button');
        addBtn.className = 'btn-ghost';
        addBtn.id = 'addMaterialBtn';
        addBtn.textContent = formTarget === 'new' ? '– Cerrar formulario' : '+ Añadir material';
        addBtn.onclick = () => {
          // Abrir/cerrar el formulario NO debe volver a dibujar los materiales de arriba
          // (eso hacía que videos/PDFs se recargaran visualmente = el parpadeo). Se inserta
          // o se quita el panel directamente, sin tocar el resto del contenido.
          const existingPanel = document.getElementById('newMaterialPanel');
          if (existingPanel) {
            existingPanel.remove();
            formTarget = null;
            addBtn.textContent = '+ Añadir material';
            return;
          }
          formTarget = 'new';
          addBtn.textContent = '– Cerrar formulario';
          const panel = buildMaterialPanel(lesson, null);
          panel.id = 'newMaterialPanel';
          row.insertAdjacentElement('afterend', panel);
          // Lleva la vista hasta el formulario recién abierto: el usuario podría estar mirando más abajo
          // y no darse cuenta de que apareció (block: 'center' evita que quede oculto bajo la barra superior).
          panel.scrollIntoView({ behavior: 'smooth', block: 'center' });
        };

        row.appendChild(delLessonBtn);
        row.appendChild(addBtn);
        main.appendChild(row);

        if (formTarget === 'new') {
          const panel = buildMaterialPanel(lesson, null);
          panel.id = 'newMaterialPanel';
          main.appendChild(panel);
        }
      }

      target.replaceChildren(...main.childNodes);
    }

    function buildMaterialPanel(lesson, existingMat) {
      const panel = document.createElement('div');
      panel.className = 'admin-panel';
      panel.style.marginTop = '14px';

      let currentType = existingMat ? existingMat.type : 'video';
      let currentMode = 'link';
      let pendingFile = null;
      let mediaRecorder = null, recordedChunks = [], recTimer = null, recSeconds = 0, recStream = null;

      panel.innerHTML = `
      <div class="admin-panel-title">${existingMat ? 'Editar material' : 'Nuevo material'}</div>
      <div class="field-row">
        <div class="field">
          <label>Tipo</label>
          <select id="matType">
            <option value="video">Video (YouTube / Drive)</option>
            <option value="text">Texto</option>
            <option value="pdf">PDF</option>
            <option value="audio">Audio</option>
            <option value="image">Imagen</option>
          </select>
        </div>
        <div class="field">
          <label>Título</label>
          <input id="matTitle" type="text" placeholder="Ej. Introducción a variables" value="${existingMat ? escapeHtml(existingMat.title) : ''}" />
        </div>
      </div>
      <div id="modeArea"></div>
      <div class="panel-btns">
        <button class="btn-solid" id="saveMatBtn">${existingMat ? 'Guardar cambios' : 'Guardar material'}</button>
        <button class="btn-ghost" id="cancelMatBtn">Cancelar</button>
      </div>
    `;

      const typeSel = panel.querySelector('#matType');
      typeSel.value = currentType;
      const modeArea = panel.querySelector('#modeArea');

      function modesForType(type) {
        if (type === 'audio') return [{ k: 'record', label: 'Grabar audio' }, { k: 'upload', label: 'Subir archivo' }, { k: 'link', label: 'Enlace' }];
        if (type === 'video') return [{ k: 'link', label: 'Enlace' }];
        return [{ k: 'upload', label: 'Subir archivo' }, { k: 'link', label: 'Enlace' }];
      }

      function acceptFor(type) {
        if (type === 'pdf') return '.pdf,application/pdf';
        if (type === 'audio') return 'audio/*';
        if (type === 'image') return 'image/*';
        return '*/*';
      }

      // solo se prellenan los campos la primera vez que se dibuja cada tipo/modo
      let didPrefillText = false, didPrefillLink = false, didPrefillUpload = false;

      function renderModeArea() {
        pendingFile = null;
        stopRecordingCleanup();

        if (currentType === 'text') {
          modeArea.innerHTML = `
          <div class="field-row">
            <div class="field" style="width:100%;">
              <label>Contenido de texto</label>
              <div class="rte-toolbar">
                <button type="button" class="rte-btn" id="rteBold" title="Negrita"><b>B</b></button>
                <button type="button" class="rte-btn italic" id="rteItalic" title="Cursiva">I</button>
                <button type="button" class="rte-btn underline" id="rteUnderline" title="Subrayado">U</button>
                <select class="rte-select" id="rteSize" title="Tamaño de letra">
                  <option value="">Tamaño</option>
                  <option value="2">Pequeño</option>
                  <option value="3">Normal</option>
                  <option value="5">Grande</option>
                  <option value="7">Muy grande</option>
                </select>
              </div>
              <div class="rte-editable" id="matContent" contenteditable="true"></div>
            </div>
          </div>`;
          const editable = modeArea.querySelector('#matContent');
          if (!didPrefillText) {
            if (existingMat && existingMat.type === 'text') editable.innerHTML = renderTextContent(existingMat.content);
            didPrefillText = true;
          }
          function applyCmd(cmd, val) { editable.focus(); document.execCommand(cmd, false, val || null); }
          modeArea.querySelector('#rteBold').addEventListener('mousedown', e => { e.preventDefault(); applyCmd('bold'); });
          modeArea.querySelector('#rteItalic').addEventListener('mousedown', e => { e.preventDefault(); applyCmd('italic'); });
          modeArea.querySelector('#rteUnderline').addEventListener('mousedown', e => { e.preventDefault(); applyCmd('underline'); });
          modeArea.querySelector('#rteSize').addEventListener('mousedown', e => e.stopPropagation());
          modeArea.querySelector('#rteSize').addEventListener('change', (e) => {
            const v = e.target.value;
            if (v) applyCmd('fontSize', v);
            e.target.value = '';
          });
          return;
        }

        const modes = modesForType(currentType);
        if (!modes.find(m => m.k === currentMode)) currentMode = modes[0].k;

        let html = `<div class="seg-control" id="segControl">`;
        modes.forEach(m => {
          html += `<button type="button" class="seg-btn ${currentMode === m.k ? 'active' : ''}" data-mode="${m.k}">${m.label}</button>`;
        });
        html += `</div><div id="modeBody"></div>`;
        modeArea.innerHTML = html;

        modeArea.querySelectorAll('.seg-btn').forEach(btn => {
          btn.onclick = () => { currentMode = btn.dataset.mode; renderModeArea(); };
        });

        const modeBody = modeArea.querySelector('#modeBody');

        if (currentMode === 'link') {
          const prefillUrl = (!didPrefillLink && existingMat && existingMat.url) ? existingMat.url : '';
          didPrefillLink = true;
          modeBody.innerHTML = `
          <div class="field-row">
            <div class="field">
              <label>URL (YouTube, Google Drive o enlace directo)</label>
              <input id="matUrl" type="text" placeholder="https://..." value="${escapeHtml(prefillUrl)}" />
            </div>
          </div>`;
          if (currentType !== 'video') {
            const note = document.createElement('div');
            note.className = 'drive-note';
            note.textContent = 'Pega el enlace para compartir de Google Drive (con acceso "cualquiera con el enlace").';
            modeBody.appendChild(note);
          }
          return;
        }

        if (currentMode === 'upload') {
          modeBody.innerHTML = `
          <div class="dropzone" id="dropzone">
            <div class="dropzone-icon">⬆</div>
            <div class="dropzone-text"><b>Arrastra un archivo aquí</b> o toca para buscarlo</div>
            <div class="dropzone-hint">Se sube directo a tu carpeta de Google Drive, sin límite de tamaño</div>
          </div>
          <input type="file" id="fileInput" accept="${acceptFor(currentType)}" style="display:none;" />
          <div id="filePreviewArea"></div>
        `;
          if (!didPrefillUpload && existingMat && existingMat.url) {
            const note = document.createElement('div');
            note.className = 'current-file-note';
            note.innerHTML = `<span>📎</span><span>Archivo actual en Google Drive — sube uno nuevo para reemplazarlo</span>`;
            modeBody.insertBefore(note, modeBody.firstChild);
          }
          didPrefillUpload = true;
          const dz = modeBody.querySelector('#dropzone');
          const input = modeBody.querySelector('#fileInput');
          dz.onclick = () => input.click();
          dz.ondragover = (e) => { e.preventDefault(); dz.classList.add('dragover'); };
          dz.ondragleave = () => dz.classList.remove('dragover');
          dz.ondrop = async (e) => {
            e.preventDefault(); dz.classList.remove('dragover');
            if (e.dataTransfer.files && e.dataTransfer.files[0]) await handleFile(e.dataTransfer.files[0]);
          };
          input.onchange = async () => {
            if (input.files && input.files[0]) await handleFile(input.files[0]);
          };
          return;
        }

        if (currentMode === 'record') {
          modeBody.innerHTML = `
          <div class="recorder-box">
            <div class="rec-status" id="recStatus">Listo para grabar</div>
            <button type="button" class="rec-btn" id="recBtn">●</button>
            <div class="rec-timer" id="recTimer">00:00</div>
            <div id="recPreviewArea"></div>
            <div class="rec-error" id="recError" style="display:none;"></div>
          </div>
        `;
          modeArea.querySelector('#recBtn').onclick = toggleRecording;
        }
      }

      async function handleFile(file) {
        pendingFile = file;
        const previewArea = modeArea.querySelector('#filePreviewArea');
        if (previewArea) {
          previewArea.innerHTML = '';
          const p = document.createElement('div');
          p.className = 'file-preview';
          p.innerHTML = `<span>📎</span><span class="fname">${escapeHtml(file.name)} · ${fmtBytes(file.size)}</span>`;
          const rm = document.createElement('button');
          rm.textContent = 'Quitar';
          rm.onclick = () => { pendingFile = null; previewArea.innerHTML = ''; };
          p.appendChild(rm);
          previewArea.appendChild(p);
        }
        const titleInput = panel.querySelector('#matTitle');
        if (titleInput && !titleInput.value) titleInput.value = file.name.replace(/\.[^.]+$/, '');
      }

      function fmtTimer(s) {
        const m = Math.floor(s / 60).toString().padStart(2, '0');
        const sec = (s % 60).toString().padStart(2, '0');
        return `${m}:${sec}`;
      }

      function stopRecordingCleanup() {
        if (recTimer) { clearInterval(recTimer); recTimer = null; }
        if (recStream) { recStream.getTracks().forEach(t => t.stop()); recStream = null; }
        mediaRecorder = null; recordedChunks = []; recSeconds = 0;
      }

      async function toggleRecording() {
        const btn = modeArea.querySelector('#recBtn');
        const status = modeArea.querySelector('#recStatus');
        const timerEl = modeArea.querySelector('#recTimer');
        const errEl = modeArea.querySelector('#recError');
        errEl.style.display = 'none';

        if (mediaRecorder && mediaRecorder.state === 'recording') {
          mediaRecorder.stop();
          return;
        }

        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          errEl.textContent = 'Tu navegador no permite grabar audio aquí. Usa "Subir archivo" en su lugar.';
          errEl.style.display = 'block';
          return;
        }

        try {
          recStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        } catch (e) {
          errEl.textContent = 'No se pudo acceder al micrófono. Revisa los permisos del navegador.';
          errEl.style.display = 'block';
          return;
        }

        recordedChunks = [];
        recSeconds = 0;
        let mimeType = '';
        if (window.MediaRecorder) {
          if (MediaRecorder.isTypeSupported('audio/webm')) mimeType = 'audio/webm';
          else if (MediaRecorder.isTypeSupported('audio/mp4')) mimeType = 'audio/mp4';
        }
        try {
          mediaRecorder = mimeType ? new MediaRecorder(recStream, { mimeType }) : new MediaRecorder(recStream);
        } catch (e) {
          errEl.textContent = 'La grabación de audio no está disponible en este navegador.';
          errEl.style.display = 'block';
          recStream.getTracks().forEach(t => t.stop());
          return;
        }

        mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data); };
        mediaRecorder.onstop = async () => {
          clearInterval(recTimer); recTimer = null;
          if (recStream) { recStream.getTracks().forEach(t => t.stop()); recStream = null; }
          btn.classList.remove('recording'); btn.textContent = '●';
          status.textContent = 'Grabación lista';
          const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
          const dataUrl = await new Promise((resolve) => {
            const r = new FileReader();
            r.onload = () => resolve(r.result);
            r.readAsDataURL(blob);
          });
          pendingFile = new File([blob], 'grabacion-' + Date.now() + '.webm', { type: blob.type || 'audio/webm' });
          const previewArea = modeArea.querySelector('#recPreviewArea');
          previewArea.innerHTML = '';
          const audioPrev = document.createElement('audio');
          audioPrev.controls = true;
          audioPrev.src = dataUrl;
          audioPrev.style.width = '100%';
          audioPrev.style.marginTop = '10px';
          previewArea.appendChild(audioPrev);
          const titleInput = panel.querySelector('#matTitle');
          if (titleInput && !titleInput.value) titleInput.value = 'Nota de audio';
        };

        mediaRecorder.start();
        btn.classList.add('recording'); btn.textContent = '■';
        status.textContent = 'Grabando…';
        recTimer = setInterval(() => {
          recSeconds++;
          timerEl.textContent = fmtTimer(recSeconds);
        }, 1000);
      }

      typeSel.onchange = () => {
        currentType = typeSel.value;
        currentMode = modesForType(currentType)[0].k;
        didPrefillText = didPrefillLink = didPrefillUpload = true; // al cambiar de tipo ya no se prellena con datos del material original
        renderModeArea();
      };
      renderModeArea();

      panel.querySelector('#cancelMatBtn').onclick = () => {
        stopRecordingCleanup();
        formTarget = null;
        panel.remove();
        const triggerBtn = existingMat
          ? document.getElementById('editMaterialBtn-' + existingMat.id)
          : document.getElementById('addMaterialBtn');
        if (triggerBtn) triggerBtn.textContent = existingMat ? 'Editar' : '+ Añadir material';
      };

      panel.querySelector('#saveMatBtn').onclick = async () => {
        const type = typeSel.value;
        const title = panel.querySelector('#matTitle').value.trim();
        if (!title) { alert('Ponle un título al material.'); return; }

        const matId = existingMat ? existingMat.id : uid();
        const newMat = { id: matId, type, title };

        if (type === 'text') {
          const editable = panel.querySelector('#matContent');
          newMat.content = sanitizeRichText(editable.innerHTML);
        } else if (currentMode === 'link') {
          const urlInput = panel.querySelector('#matUrl');
          const url = urlInput ? urlInput.value.trim() : '';
          if (!url) { alert('Pega una URL.'); return; }
          newMat.url = url;
        } else if (currentMode === 'upload' || currentMode === 'record') {
          if (!pendingFile) {
            if (existingMat && existingMat.url && existingMat.type === type && currentMode === 'upload') {
              // conservar el archivo ya guardado si no se subió uno nuevo
              newMat.mimeType = existingMat.mimeType;
              newMat.fileName = existingMat.fileName;
              newMat.url = existingMat.url;
            } else {
              alert(currentMode === 'record' ? 'Graba un audio primero.' : 'Selecciona o arrastra un archivo.');
              return;
            }
          } else {
            // El formulario desaparece de inmediato y, en el lugar donde va a quedar el
            // material, aparece la tarjeta con el indicador de "Subiendo…" y progreso real.
            pendingUpload = { lessonId: lesson.id, matId, isNew: !existingMat, title, type };
            formTarget = null;
            stopRecordingCleanup();
            await renderMain();

            try {
              const uploaded = await uploadToDrive(pendingFile, type, updateGhostProgress);
              newMat.url = uploaded.url;
            } catch (e) {
              pendingUpload = null;
              await renderMain();
              alert(e.message || 'No se pudo subir el archivo a Google Drive.');
              return;
            }

            pendingUpload = null;
            await optimisticUpdate(() => {
              if (existingMat) {
                const idx = lesson.materials.findIndex(m => m.id === matId);
                if (idx > -1) lesson.materials[idx] = newMat; else lesson.materials.push(newMat);
              } else {
                lesson.materials.push(newMat);
              }
            }, { rerender: false });
            await renderMain();
            return;
          }
        }

        await optimisticUpdate(() => {
          if (existingMat) {
            const idx = lesson.materials.findIndex(m => m.id === matId);
            if (idx > -1) lesson.materials[idx] = newMat; else lesson.materials.push(newMat);
          } else {
            lesson.materials.push(newMat);
          }

          formTarget = null;
          stopRecordingCleanup();
        }, { rerender: false });
        await renderMain();
      };

      return panel;
    }

    document.getElementById('adminBtn').addEventListener('click', async (e) => {
      e.stopPropagation();
      if (isAdmin) {
        toggleAdminMenu(e.currentTarget);
        return;
      }
      const ok = await adminLoginModal();
      if (ok) {
        isAdmin = true;
        await render();
        triggerAdminGlow();
      }
    });

    document.getElementById('hamburgerBtn').addEventListener('click', () => {
      const sb = document.getElementById('sidebar');
      if (sb.classList.contains('open')) closeSidebar(); else openSidebar();
    });
    document.getElementById('sidebarBackdrop').addEventListener('click', closeSidebar);

    document.getElementById('collapseBtn').addEventListener('click', () => {
      sidebarCollapsed = !sidebarCollapsed;
      const sb = document.getElementById('sidebar');
      sb.classList.toggle('collapsed', sidebarCollapsed);
      document.querySelector('.topbar').classList.toggle('collapsed', sidebarCollapsed);
      const btn = document.getElementById('collapseBtn');
      btn.textContent = sidebarCollapsed ? '»' : '«';
      btn.title = sidebarCollapsed ? 'Expandir panel' : 'Minimizar panel';
      btn.setAttribute('aria-label', sidebarCollapsed ? 'Expandir panel' : 'Minimizar panel');
      renderTopbar();
    });

    // Clic en el título (o el logo) de la cabecera: vuelve al inicio,
    // es decir, a la primera lección del primer módulo.
    const goHome = async () => {
      const firstMod = state.modules[0];
      if (firstMod && firstMod.lessons[0]) {
        firstMod._open = true;
        selected = { moduleId: firstMod.id, lessonId: firstMod.lessons[0].id };
        saveSelection();
        formTarget = null;
        closeSidebar();
        await render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    };
    document.getElementById('courseTitle').addEventListener('click', goHome);
    document.getElementById('logoSlot').addEventListener('click', goHome);

    const backToTopBtn = document.getElementById('backToTopBtn');
    backToTopBtn.addEventListener('click', () => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
    window.addEventListener('scroll', () => {
      backToTopBtn.classList.toggle('show', window.scrollY > 400);
    }, { passive: true });

    (async function init() {
      document.getElementById('main').innerHTML = '<div class="empty-state"><h3>Cargando curso…</h3></div>';
      initExternalLinks();
      await loadData();
      try {
        const res = await fetch('/api/auth/me', { cache: 'no-store' });
        isAdmin = res.ok && (await res.json()).isAdmin === true;
      } catch (e) { isAdmin = false; }
      // Restaura el módulo/lección donde estaba el usuario antes de recargar;
      // si ya no existe (se borró) o no hay nada guardado, cae en la primera lección.
      let restored = null;
      const savedSel = loadSelection();
      if (savedSel && savedSel.moduleId && savedSel.lessonId) {
        const mod = state.modules.find(m => m.id === savedSel.moduleId);
        if (mod && mod.lessons.some(l => l.id === savedSel.lessonId)) {
          mod._open = true;
          restored = { moduleId: mod.id, lessonId: savedSel.lessonId };
        }
      }
      if (!restored && state.modules[0]) {
        state.modules[0]._open = true;
        if (state.modules[0].lessons[0]) {
          restored = { moduleId: state.modules[0].id, lessonId: state.modules[0].lessons[0].id };
        }
      }
      if (restored) selected = restored;
      await render();
      if (isAdmin) triggerAdminGlow();
    })();
  })();
</script>
</body>
</html>
