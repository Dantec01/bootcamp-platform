<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Plataforma de lecciones del bootcamp セロトレード ACADEMY: módulos, lecciones y materiales para aprender a tu ritmo.">
  <title>セロトレード ACADEMY</title>
</head>
<body>
<style>
  :root {
    --paper: #F2F4F7;
    --paper-raised: #FFFFFF;
    --ink: #1C2541;
    --ink-soft: #4A5170;
    --line: #DCD6C4;
    --accent: #008a22;
    --accent-soft: #DCEAE6;
    --amber: #C98A2B;
    --amber-soft: #F4E6C9;
    --danger: #B5482E;
    --danger-soft: #F6E4DE;
    --admin-green: #1D7533;
    --meet: #00718A;
    --radius: 10px;
    --mono: 'IBM Plex Mono', ui-monospace, monospace;
    --sans: 'IBM Plex Sans', -apple-system, sans-serif;
    --serif: 'Fraunces', Georgia, serif;
  }

  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
  }

  #app {
    max-width: 1180px;
    margin: 0 auto;
    background: var(--paper);
    position: relative;
  }

  /* ===== TOPBAR ===== */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 30;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 14px 20px;
    background: var(--paper);
    border-bottom: 1px solid var(--line);
    transition: padding-left .18s ease;
  }

  .topbar.collapsed {
    padding-left: 11px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }

  .hamburger {
    display: none;
    flex-shrink: 0;
    width: 38px;
    height: 38px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--paper-raised);
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  .hamburger span,
  .hamburger span::before,
  .hamburger span::after {
    content: '';
    display: block;
    width: 16px;
    height: 2px;
    background: var(--ink);
    position: relative;
  }

  .hamburger span::before {
    position: absolute;
    top: -5px;
  }

  .hamburger span::after {
    position: absolute;
    top: 5px;
  }

  .logo-slot {
    flex-shrink: 0;
    width: 42px;
    height: 42px;
    border-radius: 9px;
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--paper-raised);
    overflow: hidden;
    cursor: pointer;
  }

  .logo-slot-icon {
    font-size: 20px;
    opacity: .45;
  }

  .logo-slot img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .brand-title {
    font-family: var(--serif);
    font-weight: 600;
    font-size: 20px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    cursor: pointer;
    transition: color .15s ease;
  }

  .brand-title:hover {
    color: var(--accent);
  }

  .admin-avatar-btn {
    flex-shrink: 0;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 1px solid var(--line);
    cursor: pointer;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: .15s;
    box-shadow: 0 0 0 2px transparent;
  }

  .admin-avatar-btn:hover {
    background: var(--accent);
    filter: brightness(1.08);
  }

  /* ===== EXTERNAL LINKS (Meet / Sheets) ===== */
  .topbar-links {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
    margin-left: auto;
    margin-right: 14px;
  }

  .topbar-link {
    flex-shrink: 0;
    width: 56px;
    height: 38px;
    padding: 0;
    border-radius: 10px;
    border: none;
    background: var(--meet);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    transition: .15s;
    box-shadow: 0 2px 6px rgba(0, 113, 138, .25);
  }

  .topbar-link:hover {
    filter: brightness(1.08);
    transform: translateY(-1px);
    box-shadow: 0 4px 10px rgba(0, 113, 138, .35);
  }

  .topbar-link.sheets {
    background: var(--amber-soft);
    color: var(--amber);
    box-shadow: 0 2px 6px rgba(201, 138, 43, .22);
  }

  .topbar-link.sheets:hover {
    filter: brightness(1.03);
    box-shadow: 0 4px 10px rgba(201, 138, 43, .3);
  }

  .topbar-link svg {
    width: 20px;
    height: 20px;
  }

  .sidebar-top-links {
    display: none;
  }

  .admin-avatar-btn.on {
    background: var(--admin-green);
    border-color: transparent;
    box-shadow: 0 0 0 3px rgba(29, 117, 51, .25);
  }

  .admin-avatar-btn.on.glow {
    animation: admin-glow 2.4s ease-in-out infinite;
  }

  @keyframes admin-glow {
    0%,
    100% {
      box-shadow: 0 0 0 3px rgba(29, 117, 51, .28);
    }

    50% {
      box-shadow: 0 0 0 10px rgba(29, 117, 51, .10);
    }
  }

  .admin-avatar-icon {
    width: 22px;
    height: 22px;
    color: var(--ink-soft);
  }

  .admin-avatar-btn:hover .admin-avatar-icon {
    color: #fff;
  }

  .admin-avatar-btn.on .admin-avatar-icon {
    color: #fff;
  }

  .admin-menu-popover {
    position: fixed;
    z-index: 110;
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: 10px;
    box-shadow: 0 14px 34px rgba(0, 0, 0, .2);
    padding: 12px;
    min-width: 210px;
  }

  .admin-menu-label {
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--ink-soft);
    margin-bottom: 10px;
    text-transform: uppercase;
    letter-spacing: .05em;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .admin-menu-label .status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--amber);
    flex-shrink: 0;
  }

  .admin-menu-logout {
    width: 100%;
    font-family: var(--mono);
    font-size: 12.5px;
    padding: 10px 12px;
    border-radius: 7px;
    border: 1px solid var(--danger);
    color: var(--danger);
    background: transparent;
    cursor: pointer;
  }

  .admin-menu-logout:hover {
    background: var(--danger-soft);
  }

  .modal-error {
    color: var(--danger);
    font-size: 12.5px;
    margin: -10px 0 14px;
  }

  /* ===== LAYOUT ===== */
  .body-wrap {
    display: flex;
    width: 100%;
    position: relative;
  }

  .sidebar-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(28, 37, 65, .35);
    z-index: 24;
  }

  .sidebar {
    width: 308px;
    flex-shrink: 0;
    border-right: 1px solid var(--line);
    padding: 20px 16px 60px;
    max-height: calc(100vh - 20px);
    overflow-y: auto;
  }

  .sidebar-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    margin: 4px 4px 12px;
  }

  .sidebar-label {
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  .collapse-btn {
    flex-shrink: 0;
    width: 32px;
    height: 32px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--paper-raised);
    color: var(--ink-soft);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
  }

  .collapse-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .sidebar.collapsed {
    width: 64px;
    padding-left: 8px;
    padding-right: 8px;
    transition: width .18s ease;
  }

  .sidebar {
    transition: width .18s ease;
  }

  .sidebar.collapsed .sidebar-label,
  .sidebar.collapsed .module-title-text,
  .sidebar.collapsed .lesson-title-text,
  .sidebar.collapsed .module-caret,
  .sidebar.collapsed #addModuleRow {
    display: none;
  }

  .sidebar.collapsed .sidebar-header {
    justify-content: center;
  }

  .sidebar.collapsed .module-head {
    justify-content: center;
    padding: 10px 2px;
  }

  .sidebar.collapsed .lesson-list {
    padding-left: 0;
    border-left: none;
  }

  .sidebar.collapsed .lesson-item {
    justify-content: center;
    padding: 8px 2px;
  }

  .sidebar.collapsed .admin-add-row {
    display: none;
  }

  .main {
    flex: 1;
    padding: 26px 32px 100px;
    min-width: 0;
  }

  /* ===== MODULE / LESSON TREE ===== */
  .module {
    margin-bottom: 6px;
  }

  .module-head {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 10px;
    border-radius: 8px;
    cursor: pointer;
    font-family: var(--sans);
    font-weight: 600;
    font-size: 13.5px;
    color: var(--ink);
    min-height: 40px;
  }

  .module-head:hover {
    background: var(--accent-soft);
  }

  .module-num {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--accent);
    background: var(--accent-soft);
    border-radius: 5px;
    padding: 2px 6px;
    flex-shrink: 0;
  }

  .module-caret {
    margin-left: auto;
    font-size: 10px;
    color: var(--ink-soft);
    transition: transform .15s;
  }

  .module.open .module-caret {
    transform: rotate(90deg);
  }

  .lesson-list {
    list-style: none;
    margin: 2px 0 8px;
    padding: 0 0 0 14px;
    border-left: 1px solid var(--line);
    display: none;
  }

  .module.open .lesson-list {
    display: block;
  }

  .lesson-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px 10px;
    border-radius: 7px;
    cursor: pointer;
    font-size: 13px;
    color: var(--ink-soft);
    margin: 1px 0;
    min-height: 38px;
  }

  .lesson-item:hover {
    background: var(--paper-raised);
    color: var(--ink);
  }

  .lesson-item.active {
    background: var(--ink);
    color: var(--paper);
    font-weight: 500;
  }

  .lesson-title-text {
    flex: 1;
  }

  .lesson-num {
    font-family: var(--mono);
    font-size: 10.5px;
    opacity: .7;
    flex-shrink: 0;
  }

  .lesson-item.active .lesson-num {
    opacity: .9;
  }

  .admin-add-row {
    display: flex;
    gap: 6px;
    margin: 10px 4px 18px;
    flex-wrap: wrap;
  }

  .btn-ghost {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: .03em;
    color: var(--accent);
    background: transparent;
    border: 1px dashed var(--accent);
    border-radius: 6px;
    padding: 8px 12px;
    cursor: pointer;
    min-height: 36px;
  }

  .btn-ghost:hover {
    background: var(--accent-soft);
  }

  .btn-ghost.small {
    padding: 6px 10px;
    font-size: 10.5px;
    min-height: 32px;
  }

  .btn-ghost.danger {
    color: var(--danger);
    border-color: var(--danger);
  }

  .btn-ghost.danger:hover {
    background: var(--danger-soft);
  }

  .toggle-add {
    margin-top: 6px;
  }

  /* ===== MAIN LESSON VIEW ===== */
  .lesson-header {
    border-bottom: 1px solid var(--line);
    padding-bottom: 18px;
    margin-bottom: 24px;
  }

  .lesson-eyebrow {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: .12em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .lesson-title {
    font-family: var(--serif);
    font-size: 30px;
    font-weight: 600;
    margin: 0;
    line-height: 1.18;
  }

  .lesson-title[contenteditable="true"] {
    outline: 1px dashed var(--amber);
    border-radius: 4px;
  }

  .lesson-actions {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    flex-wrap: wrap;
    margin-top: 10px;
  }

  .empty-state {
    padding: 60px 20px;
    text-align: center;
    color: var(--ink-soft);
  }

  .empty-state h3 {
    font-family: var(--serif);
    font-size: 22px;
    color: var(--ink);
    font-weight: 600;
    margin-bottom: 8px;
  }

  /* ===== MATERIAL CARDS ===== */
  .material {
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    margin-bottom: 18px;
    overflow: hidden;
  }

  .material-head {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
    flex-wrap: wrap;
  }

  .type-chip {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: .08em;
    text-transform: uppercase;
    padding: 3px 8px;
    border-radius: 5px;
    flex-shrink: 0;
  }

  .type-video {
    background: var(--accent-soft);
    color: var(--accent);
  }

  .type-text {
    background: var(--amber-soft);
    color: var(--amber);
  }

  .type-pdf {
    background: #E8E3F5;
    color: #5B4B9A;
  }

  .type-audio {
    background: #FCE3EA;
    color: #B23E63;
  }

  .type-image {
    background: #DDEEF7;
    color: #2A6E90;
  }

  .material-title {
    font-weight: 600;
    font-size: 14.5px;
    flex: 1;
    min-width: 120px;
  }

  .source-badge {
    font-family: var(--mono);
    font-size: 9.5px;
    color: var(--ink-soft);
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 2px 6px;
  }

  .material-actions {
    display: flex;
    gap: 6px;
  }

  .material-body {
    padding: 0;
  }

  .material-body iframe,
  .material-body img {
    display: block;
    width: 100%;
    border: 0;
  }

  .material-body img {
    cursor: zoom-in;
  }

  .material-body audio {
    width: 100%;
    display: block;
    margin: 16px;
    max-width: calc(100% - 32px);
  }

  .material-text {
    line-height: 1.65;
    font-size: 14.5px;
    color: var(--ink);
    padding: 16px 18px;
  }

  .material-text div,
  .material-text p {
    margin: 0 0 10px;
  }

  .material-text div:last-child,
  .material-text p:last-child {
    margin-bottom: 0;
  }

  .material-text b,
  .material-text strong {
    font-weight: 600;
  }

  .material-link {
    padding: 16px;
    font-size: 13px;
    color: var(--ink-soft);
  }

  .material-link a {
    color: var(--accent);
  }

  /* ===== ADMIN PANEL (add material) ===== */
  .admin-panel {
    border: 1px solid var(--amber);
    background: var(--amber-soft);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 20px;
  }

  .admin-panel-title {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: #8A5E1E;
    margin-bottom: 12px;
  }

  .field-row {
    display: flex;
    gap: 10px;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }

  .field {
    flex: 1;
    min-width: 160px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .field label {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--ink-soft);
    text-transform: uppercase;
    letter-spacing: .06em;
  }

  .field input,
  .field select,
  .field textarea {
    font-family: var(--sans);
    font-size: 15px;
    padding: 9px 10px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--paper-raised);
    color: var(--ink);
    min-height: 42px;
  }

  .field textarea {
    resize: vertical;
    min-height: 70px;
    font-family: var(--sans);
  }

  .panel-btns {
    display: flex;
    gap: 8px;
    margin-top: 4px;
    flex-wrap: wrap;
  }

  .upload-status {
    border: 1px solid var(--line);
    background: var(--paper-raised);
    border-radius: 10px;
    padding: 12px 14px;
    margin: 4px 0 12px;
  }

  .upload-status-label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--ink-soft);
    margin-bottom: 10px;
  }

  .upload-spinner {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    border: 2px solid var(--line);
    border-top-color: var(--accent);
    flex-shrink: 0;
    animation: upload-spin 0.7s linear infinite;
  }

  @keyframes upload-spin {
    to { transform: rotate(360deg); }
  }

  .upload-progress-track {
    height: 8px;
    border-radius: 999px;
    background: var(--paper);
    overflow: hidden;
    position: relative;
  }

  .upload-progress-fill {
    height: 100%;
    width: 0%;
    border-radius: 999px;
    background: var(--accent);
    transition: width 0.2s ease;
  }

  .upload-progress-fill.indeterminate {
    width: 35% !important;
    background: linear-gradient(90deg, var(--accent-soft), var(--accent), var(--accent-soft));
    background-size: 200% 100%;
    animation: upload-indeterminate 1.1s ease-in-out infinite;
  }

  @keyframes upload-indeterminate {
    0% { transform: translateX(-120%); }
    100% { transform: translateX(380%); }
  }

  .btn-solid {
    font-family: var(--mono);
    font-size: 12px;
    background: var(--ink);
    color: var(--paper);
    border: none;
    border-radius: 6px;
    padding: 10px 18px;
    cursor: pointer;
    min-height: 40px;
  }

  .btn-solid:hover {
    background: var(--accent);
  }

  .btn-solid:disabled {
    opacity: .5;
    cursor: not-allowed;
  }

  .seg-control {
    display: flex;
    gap: 4px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 3px;
    margin-bottom: 12px;
    width: max-content;
    max-width: 100%;
    flex-wrap: wrap;
  }

  .seg-btn {
    font-family: var(--mono);
    font-size: 11px;
    padding: 7px 12px;
    border-radius: 6px;
    cursor: pointer;
    color: var(--ink-soft);
    border: none;
    background: transparent;
    min-height: 34px;
  }

  .seg-btn.active {
    background: var(--ink);
    color: var(--paper);
  }

  .dropzone {
    border: 2px dashed var(--line);
    border-radius: 10px;
    padding: 26px 16px;
    text-align: center;
    background: var(--paper-raised);
    cursor: pointer;
    transition: .15s;
    margin-bottom: 10px;
  }

  .dropzone:hover,
  .dropzone.dragover {
    border-color: var(--accent);
    background: var(--accent-soft);
  }

  .dropzone-icon {
    font-size: 26px;
    margin-bottom: 6px;
  }

  .dropzone-text {
    font-size: 13.5px;
    color: var(--ink-soft);
  }

  .dropzone-text b {
    color: var(--accent);
  }

  .dropzone-hint {
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--ink-soft);
    margin-top: 4px;
  }

  .file-preview {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: 8px;
    margin-bottom: 10px;
    font-size: 13px;
  }

  .file-preview .fname {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .file-preview button {
    background: none;
    border: none;
    color: var(--danger);
    cursor: pointer;
    font-family: var(--mono);
    font-size: 11px;
  }

  .recorder-box {
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 18px;
    text-align: center;
    margin-bottom: 10px;
  }

  .rec-btn {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    border: none;
    background: var(--danger);
    color: #fff;
    font-size: 22px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 0 6px var(--danger-soft);
  }

  .rec-btn.recording {
    animation: pulse 1.4s infinite;
  }

  @keyframes pulse {

<script>
  (function () {
    const STORAGE_KEY = 'course-content-v2';
    const SELECTION_KEY = 'bootcamp-selected';

    // Recuerda el módulo/lección abierto para volver a esa lección tras recargar
    // la página (la vista abre la lección desde el principio, como una recarga normal).
    function saveSelection() {
      try {
        localStorage.setItem(SELECTION_KEY, JSON.stringify({ moduleId: selected.moduleId, lessonId: selected.lessonId }));
      } catch (e) { /* localStorage no disponible */ }
    }

    function loadSelection() {
      try {
        const raw = localStorage.getItem(SELECTION_KEY);
        return raw ? JSON.parse(raw) : null;
      } catch (e) { return null; }
    }

    let state = null;
    let selected = { moduleId: null, lessonId: null };
    let isAdmin = false;
    let formTarget = null; // null = cerrado, 'new' = añadiendo, o el id de un material en edición
    let sidebarCollapsed = false;

    function cloneState(value) {
      return JSON.parse(JSON.stringify(value));
    }

    function persistLocalCache() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {
        console.warn('No se pudo guardar la caché local del curso.', e);
      }
    }

    function loadLocalCache() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return null;
        const parsed = JSON.parse(raw);
        if (parsed && Array.isArray(parsed.modules)) return parsed;
      } catch (e) {
        console.warn('No se pudo leer la caché local del curso.', e);
      }
      return null;
    }

    function setStatus(message, isError = false) {
      let toast = document.getElementById('saveStatusToast');
      if (!toast) {
        toast = document.createElement('div');
        toast.id = 'saveStatusToast';
        toast.className = 'save-status-toast';
        document.body.appendChild(toast);
      }
      toast.textContent = message;
      toast.classList.toggle('error', isError);
      toast.classList.add('show');
      clearTimeout(setStatus.timeout);
      setStatus.timeout = setTimeout(() => toast.classList.remove('show'), 2500);
    }

    async function optimisticUpdate(mutator, { rerender = true } = {}) {
      const previousState = cloneState(state);
      mutator();
      persistLocalCache();
      if (rerender) await render();
      try {
        await saveData();
        setStatus('Cambios guardados');
      } catch (error) {
        state = previousState;
        persistLocalCache();
        if (rerender) await render();
        setStatus(error.message || 'No se pudo guardar el curso.', true);
      }
    }

    function uid() { return Math.random().toString(36).slice(2, 9); }

    // Enlaces externos del curso (Google Meet y Google Sheets).
    // TODO: reemplazar por las URLs reales cuando estén disponibles.
    const COURSE_LINKS = {
      meet: 'https://meet.google.com/ftd-ybah-qnd',
      sheets: 'https://docs.google.com/spreadsheets/d/1c9o7tEAx47Z3mG831psIRW-OQoPvw9wVaETn3qh-rFA/edit?usp=sharing'
    };

    function initExternalLinks() {
      for (const [key, url] of Object.entries(COURSE_LINKS)) {
        document.querySelectorAll(`[data-ext-link="${key}"]`).forEach(a => {
          if (url) a.setAttribute('href', url);
          else a.remove();
        });
      }
    }

    // Resplandor del avatar admin: solo se anima durante 10 segundos tras el login.
    function triggerAdminGlow() {
      const btn = document.getElementById('adminBtn');
      if (!btn) return;
      btn.classList.remove('glow');
      void btn.offsetWidth; // reinicia la animación aunque ya estuviera activa
      btn.classList.add('glow');
      clearTimeout(triggerAdminGlow.timeout);
      triggerAdminGlow.timeout = setTimeout(() => btn.classList.remove('glow'), 10000);
    }

    function seedData() {
      return {
        modules: []
      };
    }

    async function loadData() {
      const cached = loadLocalCache();
      if (cached) {
        state = cached;
      } else {
        state = seedData();
      }

      try {
        const res = await fetch('/api/course', { cache: 'no-store' });
        if (res.ok) {
          const data = await res.json();
          if (data.course) {
            state = data.course;
            persistLocalCache();
          }
        }
      } catch (e) {
        console.warn('No se pudo cargar el curso remoto.', e);
      }
    }

    async function saveData() {
      persistLocalCache();
      const res = await fetch('/api/course', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ course: state })
      });
      if (!res.ok) {
        const data = await res.json().catch(() => ({}));
        throw new Error(data.error || 'No se pudo guardar el curso.');
      }
    }

    function uploadToDrive(file, type, onProgress) {
      return new Promise((resolve, reject) => {
        (async () => {
          try {
            if (onProgress) onProgress(null, 'session');

            const initRes = await fetch('/api/upload-session', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ type })
            });
            const initData = await initRes.json().catch(() => ({}));
            if (!initRes.ok) throw new Error(initData.error || 'No se pudo preparar la subida a Google Drive.');
            const { accessToken, folderId } = initData;
            if (!accessToken || !folderId) throw new Error('Google Drive no devolvió los datos necesarios para subir.');

            // El navegador crea la sesión de subida directo con Google (con su propio Origin),
            // en vez de recibir una URL ya creada por el servidor: la API de Drive no deja leer
            // la respuesta de una sesión creada del lado del servidor por restricciones de CORS.
            const uploadUrl = await new Promise((res, rej) => {
              const xhr = new XMLHttpRequest();
              xhr.open('POST', 'https://www.googleapis.com/upload/drive/v3/files?uploadType=resumable&fields=id');
              xhr.setRequestHeader('Authorization', `Bearer ${accessToken}`);
              xhr.setRequestHeader('Content-Type', 'application/json; charset=UTF-8');
              if (file.type) xhr.setRequestHeader('X-Upload-Content-Type', file.type);
              xhr.onload = () => {
                if (xhr.status >= 200 && xhr.status < 300) {
                  const location = xhr.getResponseHeader('Location');
                  if (location) res(location);
                  else rej(new Error('Google Drive no devolvió una URL de subida.'));
                } else {
                  rej(new Error('Google Drive rechazó la sesión de subida (código ' + xhr.status + ').'));
                }
              };
              xhr.onerror = () => rej(new Error('Error de red preparando la subida a Google Drive.'));
              xhr.send(JSON.stringify({ name: file.name || 'archivo', parents: [folderId] }));
            });

            // El PUT también va directo a googleapis.com, nunca pasa por nuestra función de
            // Vercel, así que el límite de 4.5MB de Vercel no aplica — el único techo real es el de Drive.
            const uploadResult = await new Promise((res, rej) => {
              const xhr = new XMLHttpRequest();
              xhr.open('PUT', uploadUrl);
              if (file.type) xhr.setRequestHeader('Content-Type', file.type);
              xhr.upload.onprogress = (e) => {
                if (onProgress && e.lengthComputable) onProgress(Math.round((e.loaded / e.total) * 100), 'uploading');
              };
              xhr.upload.onload = () => { if (onProgress) onProgress(100, 'uploading'); };
              xhr.onload = () => {
                let data = {};
                try { data = JSON.parse(xhr.responseText || '{}'); } catch (e) { /* respuesta no era JSON */ }
                if (xhr.status >= 200 && xhr.status < 300) res(data);
                else rej(new Error('Google Drive rechazó el archivo (código ' + xhr.status + ').'));
              };
              xhr.onerror = () => rej(new Error('Error de red subiendo el archivo a Google Drive.'));
              xhr.send(file);
            });

            if (!uploadResult.id) throw new Error('Google Drive no devolvió el identificador del archivo.');

            if (onProgress) onProgress(null, 'finalizing');

            const finalizeRes = await fetch('/api/upload-finalize', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ fileId: uploadResult.id })
            });
            const finalizeData = await finalizeRes.json().catch(() => ({}));
            if (!finalizeRes.ok) throw new Error(finalizeData.error || 'No se pudo finalizar la subida.');

            resolve(finalizeData);
          } catch (err) {
            reject(err);
          }
        })();
      });
    }

    let pendingUpload = null; // { lessonId, matId, isNew, title, type }

    function uploadPhaseLabel(percent, phase) {
      if (phase === 'session') return 'Preparando subida…';
      if (phase === 'finalizing') return 'Guardando en Google Drive…';
      if (phase === 'uploading') return percent >= 100 ? 'Procesando en Google Drive…' : 'Subiendo…';
      return 'Subiendo…';
    }

    function buildUploadingGhostCard() {
      const card = document.createElement('div');
      card.className = 'material';
      card.id = 'uploadingGhostCard';
      card.innerHTML = `
        <div class="material-head">
          <span class="type-chip type-${pendingUpload.type}">${TYPE_LABEL[pendingUpload.type]}</span>
          <span class="material-title">${escapeHtml(pendingUpload.title)}</span>
        </div>
        <div class="upload-status" style="display:block; border:none; border-radius:0; margin:0;">
          <div class="upload-status-label">
            <span class="upload-spinner"></span>
            <span id="ghostUploadText">Subiendo…</span>
          </div>
          <div class="upload-progress-track">
            <div class="upload-progress-fill" id="ghostUploadFill"></div>
          </div>
        </div>
      `;
      return card;
    }

    function updateGhostProgress(percent, phase) {
      const fill = document.getElementById('ghostUploadFill');
      const text = document.getElementById('ghostUploadText');
      if (!fill || !text) return;
      text.textContent = uploadPhaseLabel(percent, phase);
      if (percent === null || percent >= 100) {
        fill.classList.add('indeterminate');
        if (percent !== null) fill.style.width = '100%';
      } else {
        fill.classList.remove('indeterminate');
        fill.style.width = percent + '%';
      }
    }

    const AUDIO_PREFS_KEY = 'bootcamp-audio-prefs';

    function getSavedAudioPrefs() {
      try {
        const raw = localStorage.getItem(AUDIO_PREFS_KEY);
        if (!raw) return { volume: 1, muted: false };
        const parsed = JSON.parse(raw);
        return {
          volume: typeof parsed.volume === 'number' && parsed.volume >= 0 && parsed.volume <= 1 ? parsed.volume : 1,
          muted: !!parsed.muted
        };
      } catch (e) {
        return { volume: 1, muted: false };
      }
    }

    function saveAudioPrefs(volume, muted) {
      try { localStorage.setItem(AUDIO_PREFS_KEY, JSON.stringify({ volume, muted })); } catch (e) { /* localStorage no disponible */ }
    }

    // Aplica el volumen/silencio que el usuario dejó la última vez a cada reproductor de audio,
    // y guarda cualquier cambio que haga (con refrescar o F5 el ajuste se mantiene igual).
    function applyAudioPrefs(audioEl) {
      const prefs = getSavedAudioPrefs();
      audioEl.volume = prefs.volume;
      audioEl.muted = prefs.muted;
      audioEl.addEventListener('volumechange', () => {
        saveAudioPrefs(audioEl.volume, audioEl.muted);
      });
    }

    function escapeHtml(str) {
      const d = document.createElement('div');
      d.textContent = str || '';
      return d.innerHTML;
    }

    // Permite solo negrita/cursiva/subrayado/tamaño de letra; todo lo demás se limpia.
    function sanitizeRichText(html) {
      const allowedTags = { B: 1, STRONG: 1, I: 1, EM: 1, U: 1, BR: 1, DIV: 1, P: 1, SPAN: 1, FONT: 1 };
      const stripEntirely = { SCRIPT: 1, STYLE: 1, IFRAME: 1, OBJECT: 1, EMBED: 1, LINK: 1, META: 1 };
      const container = document.createElement('div');
      container.innerHTML = html || '';

      function clean(node) {
        let changed = true;
        while (changed) {
          changed = false;
          for (const child of [...node.childNodes]) {
            if (child.nodeType === 3) continue;
            if (child.nodeType !== 1) { child.remove(); changed = true; continue; }
            if (stripEntirely[child.tagName]) {
              child.remove();
              changed = true;
              continue;
            }
            if (!allowedTags[child.tagName]) {
              while (child.firstChild) node.insertBefore(child.firstChild, child);
              node.removeChild(child);
              changed = true;
            }
          }
        }
        for (const child of [...node.childNodes]) {
          if (child.nodeType === 1) {
            for (const attr of [...child.attributes]) {
              const keep =
                (child.tagName === 'FONT' && attr.name === 'size' && /^[1-7]$/.test(attr.value)) ||
                (child.tagName === 'SPAN' && attr.name === 'style' && /^font-size:\s*\d+(\.\d+)?(px|pt|em);?$/i.test(attr.value.trim()));
              if (!keep) child.removeAttribute(attr.name);
            }
            clean(child);
          }
        }
      }
      clean(container);
      return container.innerHTML;
    }

    // Convierte texto plano heredado (sin HTML) a HTML seguro para mostrar; si ya es HTML enriquecido, lo deja igual.
    function renderTextContent(raw) {
      if (!raw) return '';
      if (/<[a-z][\s\S]*>/i.test(raw)) return raw;
      return escapeHtml(raw).replace(/\n/g, '<br>');
    }

    function fmtBytes(b) {
      if (b < 1024) return b + ' B';
      if (b < 1024 * 1024) return (b / 1024).toFixed(1) + ' KB';
      return (b / (1024 * 1024)).toFixed(1) + ' MB';
    }

    function youTubeId(url) {
      const m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([A-Za-z0-9_-]{6,})/);
      return m ? m[1] : null;
    }
    function driveFileId(url) {
      const trimmed = String(url || '').trim();
      const m = trimmed.match(/\/d\/([A-Za-z0-9_-]+)/) || trimmed.match(/[?&]id=([A-Za-z0-9_-]+)/);
      return m ? m[1] : null;
    }

    function normalizeDriveImageUrl(url) {
      const trimmed = String(url || '').trim();
      if (!trimmed) return '';
      const id = driveFileId(trimmed);
      if (!id) return trimmed;
      return `https://drive.google.com/uc?export=view&id=${id}`;
    }

    function resolveDriveMediaUrl(url) {
      return normalizeDriveImageUrl(url);
    }

    function resolveDriveFallbackUrl(url) {
      const trimmed = String(url || '').trim();
      if (!trimmed) return '';
      const id = driveFileId(trimmed);
      if (!id) return trimmed;
      return `/api/image?id=${encodeURIComponent(id)}`;
    }

    const TYPE_LABEL = { video: 'Video', text: 'Texto', pdf: 'PDF', audio: 'Audio', image: 'Imagen' };

    async function renderMaterialBody(mat) {
      if (mat.type === 'text') {
        return `<div class="material-text">${renderTextContent(mat.content)}</div>`;
      }

      const url = (mat.url || '').trim();
      if (mat.type === 'video') {
        const yt = youTubeId(url);
        if (yt) return `<div class="material-body"><div style="aspect-ratio:16/9;"><iframe src="https://www.youtube.com/embed/${yt}" style="width:100%;height:100%;" allowfullscreen></iframe></div></div>`;
        const df = driveFileId(url);
        if (df) return `<div class="material-body"><div style="aspect-ratio:16/9;"><iframe src="https://drive.google.com/file/d/${df}/preview" style="width:100%;height:100%;" allow="autoplay"></iframe></div></div>`;
        return `<div class="material-link">No se reconoció el enlace. <a href="${escapeHtml(url)}" target="_blank" rel="noopener">Abrir video ↗</a></div>`;
      }
      if (mat.type === 'pdf') {
        const df = driveFileId(url);
        if (df) return `<div class="material-body"><iframe src="https://drive.google.com/file/d/${df}/preview" style="height:520px;"></iframe></div>`;
        if (/\.pdf($|\?)/i.test(url)) return `<div class="material-body"><iframe src="${escapeHtml(url)}" style="height:520px;"></iframe></div>`;
        return `<div class="material-link"><a href="${escapeHtml(url)}" target="_blank" rel="noopener">Abrir PDF ↗</a></div>`;
      }
      if (mat.type === 'audio') {
        const df = driveFileId(url);
        const src = df ? `/api/image?id=${encodeURIComponent(df)}` : url;
        return `<div class="material-body"><audio controls preload="metadata" src="${escapeHtml(src)}"></audio></div>`;
      }
      if (mat.type === 'image') {
        const src = resolveDriveMediaUrl(url);
        const fallback = resolveDriveFallbackUrl(url);
        return `<div class="material-body"><img src="${escapeHtml(src)}" data-fallback-src="${escapeHtml(fallback)}" alt="${escapeHtml(mat.title || '')}" loading="lazy" referrerpolicy="no-referrer" onerror="this.onerror=null; if (this.getAttribute('data-fallback-src') && this.getAttribute('data-fallback-src') !== this.getAttribute('src')) { this.src = this.getAttribute('data-fallback-src'); }"></div>`;
      }
      return '';
    }

    // ===== Visor de imágenes estilo WhatsApp (zoom + pan a pantalla completa) =====
    function openImageViewer(imgEl) {
      if (document.querySelector('.image-viewer')) return; // solo un visor abierto a la vez
      const src = imgEl.currentSrc || imgEl.src;

      // Todas las imágenes de la lección actual, para navegar con flechas como en WhatsApp.
      const images = Array.from(document.querySelectorAll('#main .material-body img'));
      const currentIndexInit = Math.max(0, images.indexOf(imgEl));

      const overlay = document.createElement('div');
      overlay.className = 'image-viewer';
      overlay.setAttribute('role', 'dialog');
      overlay.setAttribute('aria-modal', 'true');
      const navArrows = images.length > 1
        ? `
        <button class="iv-btn iv-nav iv-prev" id="ivPrev" aria-label="Imagen anterior" title="Anterior (←)">‹</button>
        <button class="iv-btn iv-nav iv-next" id="ivNext" aria-label="Imagen siguiente" title="Siguiente (→)">›</button>`
        : '';
      const counter = images.length > 1 ? `<span class="iv-count" id="ivCount"></span>` : '';
      overlay.innerHTML = `
        <div class="iv-stage" id="ivStage">
          <img class="iv-img iv-loading" id="ivImg" src="${escapeHtml(src)}" alt="" draggable="false" />
        </div>
        ${navArrows}
        <button class="iv-btn iv-close" id="ivClose" aria-label="Cerrar visor" title="Cerrar (Esc)">×</button>
        <div class="iv-controls">
          ${counter}
          <button class="iv-btn" id="ivZoomOut" aria-label="Alejar" title="Alejar (−)">−</button>
          <span class="iv-pct" id="ivPct">100%</span>
          <button class="iv-btn" id="ivZoomIn" aria-label="Acercar" title="Acercar (+)">+</button>
          <button class="iv-btn" id="ivReset" aria-label="Restablecer zoom" title="Restablecer (0)">⟲</button>
        </div>
        <div class="iv-caption" id="ivCaption"></div>
      `;
      document.body.appendChild(overlay);

      const stage = overlay.querySelector('#ivStage');
      const img = overlay.querySelector('#ivImg');
      const pctEl = overlay.querySelector('#ivPct');
      const captionEl = overlay.querySelector('#ivCaption');
      const prevBtn = overlay.querySelector('#ivPrev');
      const nextBtn = overlay.querySelector('#ivNext');
      const countEl = overlay.querySelector('#ivCount');
      if (imgEl.alt) captionEl.textContent = imgEl.alt;

      let fitScale = 1, zoom = 1, tx = 0, ty = 0, currentIndex = currentIndexInit;
      let dragStart = null, moved = false;
      let lastTap = 0, lastTapX = 0, lastTapY = 0, closeTimer = null;
      const pointers = new Map();

      document.body.style.overflow = 'hidden';

      function applyTransform() {
        img.style.transform = `translate(${tx}px, ${ty}px) scale(${fitScale * zoom})`;
        pctEl.textContent = Math.round(zoom * 100) + '%';
      }

      function clampPan() {
        const rect = stage.getBoundingClientRect();
        const maxTx = Math.max(0, (img.naturalWidth * fitScale * zoom - rect.width) / 2);
        const maxTy = Math.max(0, (img.naturalHeight * fitScale * zoom - rect.height) / 2);
        tx = Math.max(-maxTx, Math.min(maxTx, tx));
        ty = Math.max(-maxTy, Math.min(maxTy, ty));
      }

      function zoomBy(factor, cx, cy) {
        const oldZoom = zoom;
        const newZoom = Math.min(8, Math.max(1, zoom * factor));
        if (newZoom === oldZoom) return;
        const ratio = newZoom / oldZoom;
        const rect = stage.getBoundingClientRect();
        const cxx = cx != null ? cx - rect.left - rect.width / 2 : 0;
        const cyy = cy != null ? cy - rect.top - rect.height / 2 : 0;
        tx = cxx - (cxx - tx) * ratio;
        ty = cyy - (cyy - ty) * ratio;
        zoom = newZoom;
        if (zoom <= 1.0001) { tx = 0; ty = 0; }
        clampPan();
        applyTransform();
      }

      function handleTap(e) {
        if (e.target !== img) { closeViewer(); return; } // toque fuera de la imagen → cerrar
        const now = Date.now();
        const isDouble = now - lastTap < 350 && Math.hypot(e.clientX - lastTapX, e.clientY - lastTapY) < 30;
        lastTap = now; lastTapX = e.clientX; lastTapY = e.clientY;
        clearTimeout(closeTimer);
        if (isDouble) {
          // doble toque/clic: alterna entre encuadre completo y zoom al punto tocado
          if (zoom > 1.0001) {
            zoom = 1; tx = 0; ty = 0;
          } else {
            zoomBy(2.5, e.clientX, e.clientY);
          }
          applyTransform();
          return;
        }
        // toque simple sin zoom → cerrar (como WhatsApp); se espera un poco por si es un doble toque
        if (zoom <= 1.0001) closeTimer = setTimeout(closeViewer, 260);
      }

      // Navegación entre imágenes de la misma lección (flechas, teclado o deslizar).
      function showImage(i) {
        if (i < 0 || i >= images.length) return;
        currentIndex = i;
        const item = images[i];
        img.src = item.currentSrc || item.src;
        captionEl.textContent = item.alt || '';
        // Reinicia zoom/pan de inmediato: la imagen queda oculta con iv-loading
        // hasta que el evento load/error calcule el encuadre real.
        zoom = 1; tx = 0; ty = 0;
        img.classList.add('iv-loading');
        applyTransform();
        if (countEl) countEl.textContent = `${i + 1} / ${images.length}`;
        updateNav();
        // Si la imagen ya está en caché, el evento load puede no volver a dispararse.
        if (img.complete && img.naturalWidth) fit();
      }

      function updateNav() {
        if (prevBtn) prevBtn.style.visibility = currentIndex > 0 ? 'visible' : 'hidden';
        if (nextBtn) nextBtn.style.visibility = currentIndex < images.length - 1 ? 'visible' : 'hidden';
      }

      function prevImage() { showImage(currentIndex - 1); }
      function nextImage() { showImage(currentIndex + 1); }
      updateNav();
      if (countEl) countEl.textContent = `${currentIndex + 1} / ${images.length}`;

      function closeViewer() {
        clearTimeout(closeTimer);
        document.removeEventListener('keydown', onKey);
        overlay.remove();
        document.body.style.overflow = '';
      }

      function onKey(e) {
        if (e.key === 'Escape') closeViewer();
        else if (e.key === '+' || e.key === '=') zoomBy(1.25, null, null);
        else if (e.key === '-' || e.key === '_') zoomBy(0.8, null, null);
        else if (e.key === '0') { zoom = 1; tx = 0; ty = 0; applyTransform(); }
        else if (e.key === 'ArrowLeft') prevImage();
        else if (e.key === 'ArrowRight') nextImage();
      }
      document.addEventListener('keydown', onKey);

      stage.addEventListener('wheel', (e) => {
        e.preventDefault();
        zoomBy(e.deltaY < 0 ? 1.12 : 0.89, e.clientX, e.clientY);
      }, { passive: false });

      stage.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        try { stage.setPointerCapture(e.pointerId); } catch (err) { /* sin captura: no es crítico */ }
        pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
        moved = false;
        if (pointers.size === 2) {
          dragStart = null;
          pointers._pinchDist = null;
          overlay.classList.add('iv-no-anim');
        } else {
          dragStart = { x: e.clientX, y: e.clientY, tx, ty };
          if (zoom > 1) {
            overlay.classList.add('iv-no-anim');
            stage.classList.add('dragging');
          }
        }
      });

      stage.addEventListener('pointermove', (e) => {
        if (!pointers.has(e.pointerId)) return;
        if (pointers.size === 2) {
          const [p1, p2] = [...pointers.values()];
          const dist = Math.hypot(p2.x - p1.x, p2.y - p1.y);
          const midX = (p1.x + p2.x) / 2;
          const midY = (p1.y + p2.y) / 2;
          const base = pointers._pinchDist || dist;
          if (!pointers._pinchDist) pointers._pinchDist = dist;
          if (base > 0) zoomBy(dist / base, midX, midY);
          pointers._pinchDist = dist;
        } else if (pointers.size === 1 && dragStart) {
          const dx = e.clientX - dragStart.x;
          const dy = e.clientY - dragStart.y;
          if (Math.abs(dx) + Math.abs(dy) > 4) moved = true;
          if (zoom > 1) {
            tx = dragStart.tx + dx;
            ty = dragStart.ty + dy;
            clampPan();
            applyTransform();
          }
        }
        const p = pointers.get(e.pointerId);
        if (p) { p.x = e.clientX; p.y = e.clientY; }
      });

      function endPointer(e) {
        const wasMulti = pointers.size >= 2;
        pointers.delete(e.pointerId);
        if (pointers.size < 2) pointers._pinchDist = null;
        if (pointers.size === 0) {
          overlay.classList.remove('iv-no-anim');
          stage.classList.remove('dragging');
          if (dragStart && !wasMulti) {
            const dx = e.clientX - dragStart.x;
            const dy = e.clientY - dragStart.y;
            dragStart = null;
            if (!moved && Math.abs(dx) < 8 && Math.abs(dy) < 8) {
              handleTap(e);
            } else if (zoom <= 1.0001 && images.length > 1 && Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy) * 1.5) {
              // deslizar en horizontal (sin zoom) cambia de imagen, como en WhatsApp
              if (dx < 0) nextImage(); else prevImage();
            }
          }
        }
      }
      stage.addEventListener('pointerup', endPointer);
      stage.addEventListener('pointercancel', endPointer);

      overlay.querySelector('#ivClose').addEventListener('click', closeViewer);
      if (prevBtn) prevBtn.addEventListener('click', prevImage);
      if (nextBtn) nextBtn.addEventListener('click', nextImage);
      overlay.querySelector('#ivZoomIn').addEventListener('click', () => zoomBy(1.25, null, null));
      overlay.querySelector('#ivZoomOut').addEventListener('click', () => zoomBy(0.8, null, null));
      overlay.querySelector('#ivReset').addEventListener('click', () => { zoom = 1; tx = 0; ty = 0; applyTransform(); });

      // Escala base: la imagen cabe en pantalla sin deformarse ni ampliarse.
      function fit() {
        const rect = stage.getBoundingClientRect();
        fitScale = (img.naturalWidth && img.naturalHeight)
          ? Math.min(1, rect.width / img.naturalWidth, rect.height / img.naturalHeight)
          : 1;
        zoom = 1; tx = 0; ty = 0;
        img.classList.remove('iv-loading');
        applyTransform();
      }
      img.addEventListener('load', fit);
      // Si la imagen no carga (Drive caído o URL rota), el visor se muestra igualmente
      // en escala base en vez de quedarse invisible: se puede cerrar con un toque.
      img.addEventListener('error', () => {
        fitScale = 1; zoom = 1; tx = 0; ty = 0;
        img.classList.remove('iv-loading');
        applyTransform();
      });
      if (img.complete && img.naturalWidth) fit();
    }

    function confirmModal(message, opts = {}) {
      const { title = '¿Confirmar?', confirmLabel = 'Eliminar', cancelLabel = 'Cancelar', danger = true } = opts;
      return new Promise(resolve => {
        const overlay = document.createElement('div');
        overlay.className = 'modal-overlay';
        overlay.innerHTML = `
        <div class="modal-box" role="alertdialog" aria-modal="true">
          <div class="modal-title">${escapeHtml(title)}</div>
          <div class="modal-message">${escapeHtml(message)}</div>
          <div class="modal-btns">
            <button class="modal-btn" id="modalCancelBtn">${escapeHtml(cancelLabel)}</button>
            <button class="modal-btn ${danger ? 'danger' : 'primary'}" id="modalConfirmBtn">${escapeHtml(confirmLabel)}</button>
          </div>
        </div>`;
        document.body.appendChild(overlay);
        function finish(v) { document.removeEventListener('keydown', onKey); overlay.remove(); resolve(v); }
        function onKey(e) { if (e.key === 'Escape') finish(false); };
        document.addEventListener('keydown', onKey);
        overlay.addEventListener('click', (e) => { if (e.target === overlay) finish(false); });
        overlay.querySelector('#modalCancelBtn').onclick = () => finish(false);
        overlay.querySelector('#modalConfirmBtn').onclick = () => finish(true);
        overlay.querySelector('#modalConfirmBtn').focus();
      });
    }

    function promptModal(title, initialValue = '') {
      return new Promise(resolve => {
        const overlay = document.createElement('div');
        overlay.className = 'modal-overlay';
        overlay.innerHTML = `
        <div class="modal-box" role="dialog" aria-modal="true">
          <div class="modal-title">${escapeHtml(title)}</div>
          <input type="text" class="modal-input" id="modalInput" value="${escapeHtml(initialValue)}" />
          <div class="modal-btns">
            <button class="modal-btn" id="modalCancelBtn">Cancelar</button>
            <button class="modal-btn primary" id="modalConfirmBtn">Guardar</button>
          </div>
        </div>`;
        document.body.appendChild(overlay);
        const input = overlay.querySelector('#modalInput');
        function finish(v) { document.removeEventListener('keydown', onKey); overlay.remove(); resolve(v); }
        function onKey(e) {
          if (e.key === 'Escape') finish(null);
          if (e.key === 'Enter') { e.preventDefault(); finish(input.value.trim() || null); }
        }
        document.addEventListener('keydown', onKey);
        overlay.addEventListener('click', (e) => { if (e.target === overlay) finish(null); });
        overlay.querySelector('#modalCancelBtn').onclick = () => finish(null);
        overlay.querySelector('#modalConfirmBtn').onclick = () => finish(input.value.trim() || null);
        setTimeout(() => { input.focus(); input.select(); }, 10);
      });
    }

    function adminLoginModal() {
      return new Promise(resolve => {
        const overlay = document.createElement('div');
        overlay.className = 'modal-overlay';
        overlay.innerHTML = `
        <div class="modal-box" role="dialog" aria-modal="true">
          <div class="modal-title">Acceso de administrador</div>
          <div class="modal-message">Ingresa el código para gestionar el curso.</div>
          <input type="password" class="modal-input" id="modalPass" placeholder="Código de administrador" autocomplete="off" />
          <div class="modal-error" id="modalLoginError" style="display:none;">Código incorrecto, intenta de nuevo.</div>
          <div class="modal-btns">
            <button class="modal-btn" id="modalCancelBtn">Cancelar</button>
            <button class="modal-btn primary" id="modalConfirmBtn">Entrar</button>
          </div>
        </div>`;
        document.body.appendChild(overlay);
        const input = overlay.querySelector('#modalPass');
        const errEl = overlay.querySelector('#modalLoginError');
        function finish(v) { document.removeEventListener('keydown', onKey); overlay.remove(); resolve(v); }
        async function attempt() {
          try {
            const res = await fetch('/api/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: input.value }) });
            if (res.ok) { finish(true); return; }
          } catch (e) { }
          errEl.style.display = 'block'; input.value = ''; input.focus();
        }
        function onKey(e) {
          if (e.key === 'Escape') finish(false);
          if (e.key === 'Enter') { e.preventDefault(); attempt(); }
        }
        document.addEventListener('keydown', onKey);
        overlay.addEventListener('click', (e) => { if (e.target === overlay) finish(false); });
        overlay.querySelector('#modalCancelBtn').onclick = () => finish(false);
        overlay.querySelector('#modalConfirmBtn').onclick = attempt;
        setTimeout(() => input.focus(), 10);
      });
    }

    function toggleAdminMenu(anchorBtn) {
      const existing = document.getElementById('adminMenuPopover');
      if (existing) { existing.remove(); return; }

      const menu = document.createElement('div');
      menu.id = 'adminMenuPopover';
      menu.className = 'admin-menu-popover';
      menu.innerHTML = `
      <div class="admin-menu-label"><span class="status-dot"></span>Sesión de administrador activa</div>
      <button class="admin-menu-logout" id="logoutBtn">Cerrar sesión</button>
    `;
      document.body.appendChild(menu);

      const rect = anchorBtn.getBoundingClientRect();
      menu.style.top = (rect.bottom + 8) + 'px';
      menu.style.right = Math.max(12, window.innerWidth - rect.right) + 'px';

      menu.querySelector('#logoutBtn').onclick = async () => {
        menu.remove();
        document.removeEventListener('click', outsideClick);
        await fetch('/api/auth/logout', { method: 'POST' }).catch(() => { });
        isAdmin = false;
        formTarget = null;
        await render();
      };

      function outsideClick(e) {
        if (menu.contains(e.target) || anchorBtn.contains(e.target)) return;
        menu.remove();
        document.removeEventListener('click', outsideClick);
      }
      setTimeout(() => document.addEventListener('click', outsideClick), 10);
    }

    function findLesson() {
      const mod = state.modules.find(m => m.id === selected.moduleId);
      if (!mod) return { mod: null, lesson: null };
      const lesson = mod.lessons.find(l => l.id === selected.lessonId);
      return { mod, lesson };
    }

            const title = await promptModal('Nueva lección', '');
